name: Market-hours monitor

on:
  schedule:
    # Every 30 minutes, 13:00-21:30 UTC Mon-Fri: covers the US session (09:30-16:00 New York) in
    # summer and winter. Each run takes well under a minute and exits at once when the market is closed,
    # so a month costs roughly 300-400 Actions minutes.
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-bot  # never overlaps with the daily run or another monitor run
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: trading
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check stops and circuit breaker
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ENABLE_PAPER_ORDERS: ${{ vars.ENABLE_PAPER_ORDERS }}
        run: python -m bot monitor
