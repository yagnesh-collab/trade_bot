name: Monthly report

on:
  schedule:
    - cron: "0 8 1 * *"  # 08:00 UTC on the 1st: report on the month that just ended
  workflow_dispatch:
    inputs:
      month:
        description: "Month to report (YYYY-MM). Empty = last month"
        required: false

permissions:
  contents: read

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: trading
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run monthly report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          MONTH: ${{ inputs.month }}
        run: python -m bot monthly ${MONTH:+--month "$MONTH"}
