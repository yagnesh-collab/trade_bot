# Trading bot configuration. Contains NO secrets — secrets live in GitHub Actions secrets / a local .env.

[paper]
# Paper portfolios start on this date with this much (fake) money, in USD.
start_date = "2026-10-26"
initial_capital = 10000.0

[costs]
# Cost charged per unit of turnover (spread + slippage). 0.0005 = 0.05 %.
per_turnover = 0.0005

[backtest]
start_date = "2005-01-01"

[data]
# How much history to download (the 200-day and 12-month signals need warm-up data).
lookback_years = 3

[broker]
# Which strategy drives Alpaca *paper* orders (only if ENABLE_PAPER_ORDERS=true and keys are set).
strategy = "multi_asset_momentum_vt"
# Keep some cash so rounding/price moves never cause a rejected order.
cash_buffer = 0.02
# Skip rebalancing trades smaller than this fraction of equity.
min_trade_fraction = 0.01
# Trailing stop placed AT THE BROKER for every paper position (percent below the high since entry).
# Alpaca executes it itself, so it protects you even when no workflow is running. 0 = off.
trailing_stop_percent = 15.0

[trend]
# Moving-average window (trading days) for the trend-following strategies.
window = 200
# Anti-whipsaw: enter only when the price is this far above the average (and exit only this far below),
# and only after this many consecutive closes. 0 and 1 = the plain rule.
band = 0.02
confirm_days = 3

[risk]
# Volatility target for the "_vt" strategies: annualised volatility the position is sized to.
# 0.10 = 10 %. Exposure is only ever reduced (max 100 %), never leveraged.
target_vol = 0.10
# Trading days used to measure recent volatility.
vol_window = 20

[momentum]
# Lookback for the momentum strategies (252 trading days = 12 months) and how many assets the
# multi-asset strategy holds at once.
lookback_days = 252
top_n = 2

[stops]
# Risk rules applied on top of every active strategy (not to the passive buy-and-hold allocations).
enabled = true
# Trailing stop-loss per holding: exit when it falls this far below its highest close since entry.
stop_loss = 0.15
# Circuit breaker: go to cash when the whole portfolio is this far below its peak.
portfolio_drawdown = 0.20
# Trading days to stay out after a stop or a breaker before following the signal again.
cooldown_days = 20
# Maximum weight of any single asset (1.0 = no cap).
max_weight = 1.0

[universe]
# Which ticker to download and trade for each canonical symbol. Defaults are the US ETFs. In the EU,
# retail brokers only sell UCITS ETFs; put their Yahoo tickers here (check each one on finance.yahoo.com),
# for example SPY = "SXR8.DE", QQQ = "EQQQ.DE". History is shorter, so set [backtest] start_date accordingly.
SPY = "SPY"
QQQ = "QQQ"
EFA = "EFA"
EEM = "EEM"
AGG = "AGG"
BIL = "BIL"
GLD = "GLD"
TLT = "TLT"

[tax]
# Flat tax on realized gains used for the after-tax estimate in the backtest. German Abgeltungsteuer incl.
# Solidaritaetszuschlag = 0.26375. Set to 0 to hide the table.
rate = 0.26375
